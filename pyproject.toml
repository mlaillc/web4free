[project]
name = "web4free"
version = "0.1.0"
description = "Free, keyless web search CLI: many providers tried in order, with rate limits, health tracking and failover."
readme = "README.md"
authors = [{ name = "Anand C Ramanathan", email = "rcanand@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.8",
    "ddgs>=9.16.1",
    "lxml>=5.0",
    "platformdirs>=4.0",
    "primp>=2.0.1",
]

[project.scripts]
web4free = "web4free.cli:main"
w4f = "web4free.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.5"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call real search providers over the network (deselect with -m 'not live')",
]
addopts = "-m 'not live'"
